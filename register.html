<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form class="register-form">

    <p class="register-title">Register</p>

    <p class="register-message">
        Signup now and get full access to our app.
    </p>

    <div class="register-flex">

        <label>
            <input required placeholder="" type="text" class="register-input">
            <span>Firstname</span>
        </label>

        <label>
            <input required placeholder="" type="text" class="register-input">
            <span>Lastname</span>
        </label>

    </div>

    <label>
        <input required placeholder="" type="email" class="register-input">
        <span>Email</span>
    </label>

    <label>
        <input required placeholder="" type="password" class="register-input">
        <span>Password</span>
    </label>

    <label>
        <input required placeholder="" type="password" class="register-input">
        <span>Confirm password</span>
    </label>

    <button class="register-submit">Submit</button>

    <p class="register-signin">
        Already have an account?
        <a href="login.html">Signin</a>
    </p>

</form>
<script>
	document.querySelector(".register-form").addEventListener("submit", function(e) {
    e.preventDefault();

    // Login successful
    alert("Login Successful!");


    window.location.href = "index.html";
});
</script>

</body>
</html>
