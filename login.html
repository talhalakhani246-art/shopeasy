<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <p class="login-title">Login</p>

    <form class="login-form">

        <div class="login-input-group">

            <label for="username">Username</label>

            <input
                type="text"
                name="username"
                id="username"
                placeholder=""
            >

        </div>


        <div class="login-input-group">

            <label for="password">Password</label>

            <input
                type="password"
                name="password"
                id="password"
                placeholder=""
            >

            <div class="login-forgot">

                <a href="#">Forgot Password?</a>

            </div>

        </div>


        <button class="login-sign" type="submit">
            Sign in
        </button>

    </form>


    <div class="login-social-message">

        <div class="login-line"></div>

        <p class="login-message">
            Login with social accounts
        </p>

        <div class="login-line"></div>

    </div>


    <div class="login-social-icons">

        <button aria-label="Log in with Google" class="login-icon">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 32 32"
            >
                <path d="M16.318 13.714v5.484h9.078c-.37 2.354-2.745 6.901-9.078 6.901-5.458 0-9.917-4.521-9.917-10.099s4.458-10.099 9.917-10.099c3.109 0 5.193 1.318 6.38 2.464l4.339-4.182c-2.786-2.599-6.396-4.182-10.719-4.182-8.844 0-16 7.151-16 16s7.156 16 16 16c9.234 0 15.365-6.49 15.365-15.635 0-1.052-.115-1.854-.255-2.651z"/>
            </svg>

        </button>


        <button aria-label="Log in with Twitter" class="login-icon">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 32 32"
            >
                <path d="M31.937 6.093c-1.177.516-2.437.871-3.765 1.032 1.355-.813 2.391-2.099 2.885-3.631-1.271.74-2.677 1.276-4.172 1.579-1.192-1.276-2.896-2.079-4.787-2.079-3.625 0-6.563 2.937-6.563 6.557 0 .521.063 1.021.172 1.495-5.453-.255-10.287-2.875-13.52-6.833-.568.964-.891 2.084-.891 3.303 0 2.281 1.161 4.281 2.916 5.457-1.073-.031-2.083-.328-2.968-.817v.079c0 3.181 2.26 5.833 5.26 6.437-.547.145-1.131.229-1.724.229-.421 0-.823-.041-1.224-.115.844 2.604 3.26 4.5 6.14 4.557-2.239 1.755-5.077 2.801-8.135 2.801-.521 0-1.041-.025-1.563-.088 2.917 1.86 6.36 2.948 10.079 2.948 12.067 0 18.661-9.995 18.661-18.651 0-.276 0-.557-.021-.839 1.287-.917 2.401-2.079 3.281-3.396z"/>
            </svg>

        </button>


        <button aria-label="Log in with GitHub" class="login-icon">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 32 32"
            >
                <path d="M16 0.396c-8.839 0-16 7.167-16 16 0 7.073 4.584 13.068 10.937 15.183.803.151 1.093-.344 1.093-.772 0-.38-.009-1.385-.015-2.719-4.453.964-5.391-2.151-5.391-2.151-.729-1.844-1.781-2.339-1.781-2.339-1.448-.989.115-.968.115-.968 1.604.109 2.448 1.645 2.448 1.645 1.427 2.448 3.744 1.74 4.661 1.328.14-1.031.557-1.74 1.011-2.135-3.552-.401-7.287-1.776-7.287-7.907 0-1.751.62-3.177 1.645-4.297-.177-.401-.719-2.031.141-4.235 0 0 1.339-.427 4.4 1.641 1.281-.355 2.641-.532 4-.541 1.36.009 2.719.187 4 .541 3.043-2.068 4.381-1.641 4.381-1.641.859 2.204.317 3.833.161 4.235 1.015 1.12 1.635 2.547 1.635 4.297 0 6.145-3.74 7.5-7.296 7.891.556.479 1.077 1.464 1.077 2.959 0 2.14-.020 3.864-.020 4.385 0 .416.28.916 1.104.755 6.4-2.093 10.979-8.093 10.979-15.156 0-8.833-7.161-16-16-16z"/>
            </svg>

        </button>

    </div>


    <p class="login-signup">
        Don't have an account?
        <a href="register.html">Register</a>
    </p>

</div>
<script>
	document.querySelector(".login-form").addEventListener("submit", function(e) {
    e.preventDefault();

    // Login successful
    alert("Login Successful!");


    window.location.href = "index.html";
});
</script>

</body>
</html>
