<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Ecommerce</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark main-navbar">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-cart-shopping"></i>
                ShopEasy
            </a>


            <!-- Mobile Menu Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="navbarContent">


                <!-- Center Menu -->
                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Contact Us
                        </a>
                    </li>

                </ul>


                <!-- Login / Signin -->
                <div class="auth-buttons">

                    <button
                        type="button"
                        class="btn login-btn">
                        Login
                    </button>

                    <button
                        type="button"
                        class="btn signin-btn">
                        Signin
                    </button>

                </div>

            </div>

        </div>

    </nav>



    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="container">

            <div class="hero-content">

                <h1>
                    Welcome To
                    <span>ShopEasy Store</span>
                </h1>

                <h3>
                    Shop Smart. Live Better.
                </h3>

                <p>
                    Discover amazing products, unbeatable deals,
                    and everything you need — all in one easy
                    shopping experience.
                </p>


                <!-- Hero Buttons -->
                <div class="hero-buttons">

                    <a href="#" class="btn shop-now">
                        Shop Now
                    </a>

                    <a href="#" class="btn explore">
                        Explore Products
                    </a>

                </div>

            </div>

        </div>

    </section>



    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
